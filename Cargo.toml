[package]
name = "smartva-rust"
version = "0.2.0"
edition = "2024"
description = "100% Pure Native Rust SmartVA-Analyze engine, drop-in CLI replacement (smartva-rs), and C-ABI FFI library"
license = "MIT"

[lib]
name = "smartva_rust"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "smartva-rs"
path = "src/bin/smartva_rs.rs"

[[bin]]
name = "phmrc-source-prep"
path = "src/bin/phmrc_source_prep.rs"

[dependencies]
ab_glyph = "0.2"
anyhow = "1"
chrono = "0.4"
csv = "1.3"
font-kit = "0.14"
image = { version = "0.25", default-features = false, features = ["png"] }
plotters = { version = "0.3.7", default-features = false, features = ["bitmap_backend", "bitmap_encoder", "ttf"] }
rust_xlsxwriter = "0.94"
tempfile = "3"
